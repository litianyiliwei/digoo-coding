    :root {

      --review-border: #dce5d7;
      --review-brand: #2f6b3f;
    }
    body {
      margin: 0;
      font-family: "Noto Sans SC", system-ui, sans-serif;
      background: var(--review-bg);
      color: var(--review-text);
    }
    header { padding: 32px 40px 16px; }
    header h1 { margin: 0 0 8px; font-size: 28px; }
    header p { margin: 0; color: var(--review-muted); }
    main { padding: 0 40px 40px; display: grid; gap: 24px; }
    section {
      background: var(--review-surface);
      border: 1px solid var(--review-border);
      border-radius: 12px;
      padding: 20px 24px;
    }
    section h2 { margin: 0 0 12px; font-size: 18px; color: var(--review-brand); }
    ul { margin: 0; padding-left: 20px; }
    li { margin: 6px 0; }
    a { color: var(--review-brand); }
    code { color: var(--review-muted); }
  </style>
</head>
