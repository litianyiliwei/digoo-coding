# Ruff configuration — Python starter pack.
# Target: Python 3.12+, Ruff 0.9.x+ (pin the exact version at 03).
# ruff check . ; ruff format --check .

target-version = "py312"
line-length = 100

[lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "S",    # flake8-bandit (security)
  "ASYNC",# flake8-async
  "DTZ",  # flake8-datetimez
  "PTH",  # flake8-use-pathlib
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "T20",  # flake8-print (common rule 3)
  "RUF"   # Ruff-specific rules
]
ignore = [
  "RUF001", # ambiguous unicode: full-width punctuation in Chinese text is intentional
  "RUF002",
  "RUF003"
]
fixable = ["ALL"]

[lint.per-file-ignores]
"tests/**" = ["S101", "T201"]
"**/tests/**" = ["S101", "T201"]
"__init__.py" = ["F401"]

[lint.pydocstyle]
convention = "google"

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
