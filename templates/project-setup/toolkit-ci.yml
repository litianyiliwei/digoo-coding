name: toolkit-ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  toolkit-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Toolkit and project checks
        run: bash scripts/ci-check.sh
